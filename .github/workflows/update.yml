name: Update dashboard

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Publish even if there are fewer interviews than the live site shows"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "config/**", "dict/**", ".github/workflows/update.yml"]

permissions:
  contents: write   # to keep the latest backup as a release file
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch survey data from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python pipeline/fetch_dropbox.py

      - id: pages
        uses: actions/configure-pages@v5

      - name: Read what the live site shows now
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/status.json" -o previous-status.json || echo "no live site yet"

      - name: Merge both questionnaires and build the summary file
        env:
          ALLOW_DROP: ${{ github.event.inputs.allow_drop == 'true' && '1' || '0' }}
        run: python pipeline/build.py --previous previous-status.json

      - name: Locked backup for the site's Download button (CSV, Stata .dta and the CSPro .csdb files)
        id: backup
        continue-on-error: true
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          pip install --quiet pandas cryptography
          python pipeline/backup.py --out backup --encrypt site/backup.bin

      - name: Keep today's locked backup in GitHub (release "latest-backup", previous one removed)
        if: steps.backup.outcome == 'success' && hashFiles('site/backup.bin') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Asia/Dhaka date +%F)
          NAME="remittance_backup_${TODAY}.bin"
          gh release view latest-backup >/dev/null 2>&1 || gh release create latest-backup --title "Latest data backup" \
            --notes "Locked with the BACKUP_PASSWORD secret. Download it from the dashboard's Download backup button, or download the .bin here and unlock it there. Only the latest day is kept." --latest=false
          OLD=$(gh release view latest-backup --json assets -q '.assets[].name')
          if echo "$OLD" | grep -qx "$NAME"; then echo "Today's backup is already in the release"; exit 0; fi
          cp site/backup.bin "$NAME"
          gh release upload latest-backup "$NAME" --clobber
          for a in $OLD; do [ "$a" != "$NAME" ] && gh release delete-asset latest-backup "$a" -y || true; done
          echo "Saved $NAME in the release latest-backup"

      - name: Remove the raw data (only site/data.json is published)
        if: always()
        run: rm -rf data backup backup-repo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
